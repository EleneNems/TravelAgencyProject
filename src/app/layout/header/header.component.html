<header class="header">
  <div class="content">
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <span class="dec">:</span>
      <a routerLink="/tour/1" routerLinkActive="active">Tours</a>
      <span class="dec">:</span>
      <a routerLink="/about" routerLinkActive="active">About</a>
      <span class="dec">:</span>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>

    <div class="right">
      <button class="search-btn"><a routerLink="/search">Search</a></button>

      
      <div class="profile-wrapper">
        <img src="header/profile.png" alt="profile" (click)="onProfileClick()" />

        <div class="profile-menu" *ngIf="showMenu && auth.isAuthenticated()">
          <p>
            Hello, <strong>{{ userName }}</strong>
          </p>
          <button (click)="logout()">Sign out</button>
        </div>
      </div>
    </div>
  </div>
</header>
